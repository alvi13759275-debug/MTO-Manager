name: Build MTO Manager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Archive if Uploaded as Zip
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o *.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate Project Directory and Build APK
      run: |
        if [ -d "MTO_MANAGER_COMPLETE_SUITE" ]; then
          cd MTO_MANAGER_COMPLETE_SUITE
        elif [ -d "MTO-Manager-main" ]; then
          cd MTO-Manager-main
        fi
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MTO_Manager_Debug_APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
          *.apk
